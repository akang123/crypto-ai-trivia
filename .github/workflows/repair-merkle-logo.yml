name: Repair Merkle logo publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch page
        env:
          BASE_COMMIT: 2117aa96223c53f7dfa14608629be3b1aee136cd
        run: |
          git show "$BASE_COMMIT:index.html" > index.html
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text()

          old = '    <meta property="og:type" content="website" />'
          new = '''    <meta property="og:image" content="https://akang123.github.io/crypto-ai-trivia/assets/merkle-icon.png" />
    <meta property="og:image:alt" content="Merkle Research logo" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://akang123.github.io/crypto-ai-trivia/assets/merkle-icon.png" />
    <link rel="icon" type="image/png" href="assets/merkle-icon.png" />
    <link rel="apple-touch-icon" href="assets/merkle-icon.png" />'''
          if html.count(old) != 1:
              raise SystemExit("metadata anchor not found exactly once")
          html = html.replace(old, new, 1)

          pattern = r'(?s)      \.brand-mark \{.*?\n      \}'
          replacement = '''      .brand-mark {
        display: block;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border: 1px solid var(--line-strong);
        background: var(--black);
        object-fit: cover;
      }'''
          html, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit("brand CSS anchor not found exactly once")

          old = '          <span class="brand-mark" aria-hidden="true">M</span>'
          new = '          <img class="brand-mark" src="assets/merkle-icon.png" alt="Merkle Research logo" width="40" height="40" decoding="async" />'
          if html.count(old) != 1:
              raise SystemExit("brand markup anchor not found exactly once")
          html = html.replace(old, new, 1)

          path.write_text(html)
          PY
          rm .github/workflows/repair-merkle-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-merkle-logo.yml
          git commit -m "Repair Merkle Research logo publish"
          git push origin HEAD:main