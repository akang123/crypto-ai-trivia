name: Repair Merkle logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source
        uses: actions/checkout@v4

      - name: Rebuild and verify logo
        run: |
          set -euo pipefail
          {
            cat .repair/chunks/part-aa .repair/chunks/part-ab .repair/chunks/part-ac
            cat .repair/fixes/ad-aa .repair/fixes/ad-ab
            cat .repair/fixes-v3/ad-ac-aa .repair/fixes-v3/ad-ac-ab
            cat .repair/fixes-v5/ad-ac-ab-aa .repair/fixes-v5/ad-ac-ab-ab
            cat .repair/chunks/part-ae .repair/chunks/part-af .repair/chunks/part-ag .repair/chunks/part-ah
            cat .repair/fixes/ai-aa .repair/fixes/ai-ab .repair/fixes/ai-ac
            cat .repair/chunks/part-aj .repair/chunks/part-ak .repair/chunks/part-al .repair/chunks/part-am
            cat .repair/chunks/part-an .repair/chunks/part-ao .repair/chunks/part-ap .repair/chunks/part-aq
            cat .repair/chunks/part-ar
            cat .repair/fixes/as-aa .repair/fixes/as-ab .repair/fixes/as-ac
            cat .repair/chunks/part-at .repair/chunks/part-au .repair/chunks/part-av .repair/chunks/part-aw
            cat .repair/fixes/ax-aa .repair/fixes/ax-ab .repair/fixes/ax-ac
            cat .repair/chunks/part-ay
            cat .repair/fixes-v4/az-aa-aa .repair/fixes-v4/az-aa-ab
            cat .repair/fixes/az-ab .repair/fixes/az-ac
            cat .repair/chunks/part-ba
            cat .repair/fixes/bb-aa .repair/fixes-v2/bb-ab-aa .repair/fixes-v3/bb-ab-ab
          } | tr -d '\r\n' | base64 --decode > assets/merkle-icon.png
          test "$(sha256sum assets/merkle-icon.png | cut -d' ' -f1)" = "70a96011f489c15f216379cda4eebc4631693587823d935dd2725183fc54ea4d"

      - name: Repair metadata line breaks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text()
          if "\\n" not in text:
              raise SystemExit("expected escaped metadata line breaks")
          path.write_text(text.replace("\\n", chr(10)))
          PY
          test "$(grep -F -o '\\n' index.html | wc -l | tr -d ' ')" = "0"
          test "$(grep -F -c 'meta property=\"og:image:alt\"' index.html)" = "1"

      - name: Publish and clean staging files
        run: |
          set -euo pipefail
          rm -rf .repair .github/workflows/repair-merkle-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: publish verified Merkle logo and metadata'
          git push
